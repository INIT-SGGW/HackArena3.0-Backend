language = "C"
documentation = true
cpp_compat = true

include_guard = "BOINK_C_API_H"
pragma_once = true

header = """
/* Boink FFI header — generated by cbindgen.
   This header declares the stable C ABI for the Boink engine.
   It contains only types and function signatures — the implementation
   lives in the native engine (C/C++). */

// clang-format off

#if !defined(BOINK_API)
  #if defined(_WIN32) || defined(__CYGWIN__)
    #if defined(BOINK_BUILD_DLL)
      #define BOINK_API __declspec(dllexport)
    #elif defined(BOINK_USE_DLL)
      #define BOINK_API __declspec(dllimport)
    #else
      #define BOINK_API
    #endif
  #else
    #define BOINK_API __attribute__((visibility("default")))
  #endif
#endif
"""

trailer = """
// clang-format on
"""

[parse]
parse_deps = false

[export]
exclude = ["bool"]
include = ["BoinkGhostModeBlocker"]
