[package]
name = "game-server"
version = "0.1.0"
edition.workspace = true

[features]
default = []
proto-local = ["proto/proto-local"]

[dependencies]
bytes = { workspace = true }
dotenv = { workspace = true}
itertools = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

game-engine = { path = "../game-engine" }
hash-cache = { path = "../libs/hash-cache" }
proto = { path = "../proto", default-features = false }

anyhow = "1.0.100"
async-stream = "0.3.6"
dashmap = "6.1.0"
futures-core = "0.3.31"
http = "1.3.1"
sha2 = "0.10.9"
tokio-stream = "0.1.17"
tonic-health = "0.14.2"
tonic-web = "0.14.2"
tower-http = { version = "0.6.6", features = ["cors"] }
