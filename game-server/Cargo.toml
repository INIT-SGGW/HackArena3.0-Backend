[package]
name = "game-server"
version = "0.1.0-beta.2"
edition.workspace = true

[[bin]]
name = "ha3-backend-official"
path = "src/bin/ha3-backend-official.rs"

[[bin]]
name = "ha3-backend-local"
path = "src/bin/ha3-backend-local.rs"

[features]
default = []
ide = []
official = ["sqlx"]
local = []

[dependencies]
bytes = { workspace = true }
dotenv = { workspace = true}
itertools = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = "0.22.1"
serde_json = "1.0.145"

boink = { path = "../game-engine/boink" }
hash-cache = { path = "../libs/hash-cache" }
proto = { path = "../proto", default-features = false }

anyhow = "1.0.100"
async-stream = "0.3.6"
dashmap = "6.1.0"
futures-core = "0.3.31"
http = "1.3.1"
if-addrs = "0.13"
jsonwebtoken = "9.3.1"
flate2 = "1.1.5"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8.23"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12.2"
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic-health = "0.14.2"
tonic-web = "0.14.2"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
uuid = { version = "1.21.0", features = ["v4", "v5"] }
sqlx = { version = "0.8.4", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"], optional = true }
